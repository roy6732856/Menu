<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ILLYALL Projects</title>
    <!-- CSS Dependencies -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark fixed-top">
        <div class="container">
            <a class="navbar-brand" href="#" data-i18n="title">ILLYALL@伊利歐</a>
            <div class="ms-auto">
                <button class="btn btn-outline-light btn-sm mx-2" id="lang-zh">繁體中文</button>
                <button class="btn btn-outline-light btn-sm" id="lang-en">English</button>
            </div>
        </div>
    </nav>

    <!-- Hero Section with Particles -->
    <section id="hero" class="hero-section">
        <div id="particles-js"></div>
        <div class="container h-100">
            <div class="row h-100 align-items-center">
                <div class="col-lg-12 text-center">
                    <div class="hero-content" data-aos="fade-up">
                        <h1 class="hero-title" data-i18n="heroTitle">ILLYALL Projects</h1>
                        <p class="hero-subtitle" data-i18n="heroSubtitle">探索創新技術的無限可能</p>
                        <a href="#projects" class="btn btn-gradient btn-lg mt-4" data-i18n="ctaButton">探索項目</a>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Projects Section -->
    <section id="projects" class="section-padding">
        <div class="container">
            <div class="row">
                <div class="col-lg-12 text-center mb-5">
                    <h2 class="section-title" data-aos="fade-up" data-i18n="projectsTitle">精選項目</h2>
                    <div class="section-divider"></div>
                </div>
            </div>
            <div class="row" id="projects-container">
                <!-- Projects will be dynamically inserted here -->
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer-section">
        <div class="container">
            <div class="row">
                <div class="col-lg-12 text-center">
                    <p data-i18n="footer">ILLYALL &copy; 2025</p>
                </div>
            </div>
        </div>
    </footer>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script src="https://unpkg.com/i18next@21.6.12/dist/umd/i18next.min.js"></script>
    <script src="projects.js"></script>

    <script>
        // Initialize AOS
        AOS.init({
            duration: 1000,
            once: true
        });

        // Initialize Particles.js
        particlesJS('particles-js', {
            particles: {
                number: { value: 80 },
                color: { value: '#ffffff' },
                shape: { type: 'circle' },
                opacity: {
                    value: 0.5,
                    random: false
                },
                size: {
                    value: 3,
                    random: true
                },
                line_linked: {
                    enable: true,
                    distance: 150,
                    color: '#ffffff',
                    opacity: 0.4,
                    width: 1
                },
                move: {
                    enable: true,
                    speed: 6,
                    direction: 'none',
                    random: false,
                    straight: false,
                    out_mode: 'out',
                    bounce: false
                }
            },
            interactivity: {
                detect_on: 'canvas',
                events: {
                    onhover: {
                        enable: true,
                        mode: 'repulse'
                    },
                    resize: true
                }
            },
            retina_detect: true
        });

        // Initialize i18next
        i18next.init({
            lng: 'zh',
            debug: false,
            resources: {
                zh: {
                    translation: {
                        "title": "ILLYALL - 伊利歐歐歐歐",
                        "heroTitle": "ILLYALL Projects",
                        "heroSubtitle": "沒事就會有新的東西...吧",
                        "ctaButton": "看看我有什麼",
                        "projectsTitle": "我的玩具",
                        "noProject": "目前沒有玩具。",
                        "footer": "ILLYALL &copy; 2025"
                    }
                },
                en: {
                    translation: {
                        "title": "ILLYALL",
                        "heroTitle": "ILLYALL Projects",
                        "heroSubtitle": "Explore Infinite Possibilities in Technology",
                        "ctaButton": "Explore Projects",
                        "projectsTitle": "Featured Projects",
                        "noProject": "No projects available.",
                        "footer": "ILLYALL &copy; 2025"
                    }
                }
            }
        }, function(err, t) {
            updateContent();
        });

        // Update content based on language
        function updateContent() {
            document.querySelectorAll('[data-i18n]').forEach(element => {
                const key = element.getAttribute('data-i18n');
                element.innerHTML = i18next.t(key);
            });
        }

        // Language switchers
        document.getElementById('lang-zh').addEventListener('click', function() {
            i18next.changeLanguage('zh', updateContent);
        });
        document.getElementById('lang-en').addEventListener('click', function() {
            i18next.changeLanguage('en', updateContent);
        });

        // Render projects
        document.addEventListener('DOMContentLoaded', function() {
            const projects = window.projects || [];
            const container = document.getElementById('projects-container');

            if (projects.length === 0) {
                container.innerHTML = '<div class="col-12"><p class="text-center" data-i18n="noProject">' + i18next.t('noProject') + '</p></div>';
                return;
            }

            projects.forEach(function(proj, index) {
                const col = document.createElement('div');
                col.className = 'col-lg-4 col-md-6 mb-4';
                col.setAttribute('data-aos', 'fade-up');
                col.setAttribute('data-aos-delay', (index * 100).toString());

                // 檢查圖片路徑是否存在
                const imgSrc = proj.image || 'image/default-project.svg';
                
                col.innerHTML = `
                    <div class="project-wrapper">
                        <a href="${proj.link}" target="_blank" class="project-card-link">
                            <div class="project-card">
                                <div class="project-image">
                                    <img src="${imgSrc}" alt="${proj.name}" 
                                         onerror="this.onerror=null; this.src='${imgSrc}';">
                                </div>
                            </div>
                        </a>
                        <h3 class="project-title">${proj.name}</h3>
                    </div>
                `;

                container.appendChild(col);
            });
        });
    </script>
</body>
</html>
